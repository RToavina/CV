<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Éclairage solaire autonome | Projet</title>
  <style>
    :root { color-scheme: dark; --ink: #f4f1e8; --muted: #b8b4aa; --accent: #e2a93b; --bg: #172326; --panel: #213236; --line: #52645e; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: var(--ink); background: radial-gradient(circle at top, #314746, var(--bg) 60%); font-family: Georgia, 'Times New Roman', serif; }
    main { width: min(1100px, calc(100% - 32px)); margin: 0 auto; padding: 42px 0 36px; }
    .eyebrow { margin: 0 0 10px; color: var(--accent); font: 600 .76rem/1.2 Consolas, monospace; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2rem, 5vw, 4rem); font-weight: 500; }
    .intro { max-width: 650px; margin: 12px 0 28px; color: var(--muted); font-size: 1.05rem; line-height: 1.55; }
    .viewer { overflow: hidden; border: 1px solid var(--line); background: #10191b; box-shadow: 0 18px 50px #09101288; }
    .stage { position: relative; display: grid; place-items: center; min-height: min(67vh, 700px); padding: 18px; }
    .stage img { display: block; width: 100%; max-height: 67vh; object-fit: contain; animation: photo-enter .45s ease both; }
    .nav { position: absolute; top: 50%; display: grid; place-items: center; width: 44px; height: 44px; border: 1px solid #ffffff55; border-radius: 50%; color: var(--ink); background: #10191bcc; font-size: 1.5rem; cursor: pointer; transform: translateY(-50%); transition: border-color .2s ease, color .2s ease, background .2s ease, transform .2s ease; }
    .nav:hover, .nav:focus-visible { border-color: var(--accent); color: var(--accent); }
    .nav--prev { left: 18px; } .nav--next { right: 18px; }
    .nav--prev:hover, .nav--prev:focus-visible { transform: translate(-3px, -50%); }
    .nav--next:hover, .nav--next:focus-visible { transform: translate(3px, -50%); }
    .caption { display: flex; justify-content: space-between; gap: 16px; padding: 12px 16px; border-top: 1px solid var(--line); color: var(--muted); font: .78rem Consolas, monospace; }
    .thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px; max-height: 150px; overflow: auto; padding: 14px; border-top: 1px solid var(--line); }
    .thumb { aspect-ratio: 1; padding: 0; overflow: hidden; border: 2px solid transparent; background: transparent; cursor: pointer; transition: transform .2s ease, border-color .2s ease, opacity .2s ease; }
    .thumb:hover, .thumb:focus-visible { transform: translateY(-3px); opacity: .9; }
    .thumb[aria-current="true"] { border-color: var(--accent); } .thumb img { width: 100%; height: 100%; object-fit: cover; }
    @keyframes photo-enter { from { opacity: .35; transform: scale(.985); } to { opacity: 1; transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) { .stage img, .nav, .thumb { animation: none; transition: none; } .nav--prev:hover, .nav--next:hover, .thumb:hover { transform: none; } }
    @media (max-width: 600px) { main { width: min(100% - 20px, 1100px); padding-top: 26px; } h1 { font-size: clamp(2rem, 11vw, 3rem); } .stage { min-height: 48vh; padding: 8px; } .nav--prev { left: 8px; } .nav--next { right: 8px; } .caption { display: block; line-height: 1.6; } .thumbs { grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); padding: 10px; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">PRJ-02 · Projet pédagogique</p>
    <h1>Éclairage solaire autonome</h1>
    <p class="intro">Étude, dimensionnement et réalisation d'un système d'éclairage photovoltaïque par les élèves de 3e.</p>
    <section class="viewer" aria-label="Carrousel de photos du projet panneau solaire">
      <div class="stage">
        <button class="nav nav--prev" type="button" aria-label="Photo précédente">‹</button>
        <img id="photo" src="" alt="">
        <button class="nav nav--next" type="button" aria-label="Photo suivante">›</button>
      </div>
      <div class="caption"><span id="filename"></span><span id="counter"></span></div>
      <div class="thumbs" id="thumbs" aria-label="Choisir une photo"></div>
    </section>
  </main>
  <script>
    const photos = [
      'PXL_20260410_121736266.jpg', 'PXL_20260410_121725023.jpg', 'PXL_20260410_121315775.jpg',
      'PXL_20260410_120724951.jpg', 'PXL_20260410_120717742.jpg', 'PXL_20260410_115144824.jpg',
      'PXL_20260407_083447324.jpg', 'PXL_20260407_083323491.jpg', 'PXL_20260407_082704227.jpg',
      'PXL_20260407_082702428.jpg', 'PXL_20260407_082215473.jpg', 'PXL_20260407_082138526.jpg',
      'PXL_20260407_081935227.jpg', 'PXL_20260407_081342185.jpg', 'PXL_20260407_081109086.jpg',
      'PXL_20260407_075552058.jpg', 'PXL_20260407_075319709.jpg', 'PXL_20260407_074450875.jpg',
      'PXL_20260407_073540618.jpg', 'PXL_20260407_073358621.jpg', 'PXL_20260325_081125556.jpg',
      'PXL_20260325_081116721.jpg', 'PXL_20260324_081756512.jpg', 'PXL_20260324_055437924.jpg',
      'PXL_20260324_052650629.jpg'
    ];
    const photo = document.getElementById('photo');
    const filename = document.getElementById('filename');
    const counter = document.getElementById('counter');
    const thumbs = document.getElementById('thumbs');
    let current = 0;
    function showPhoto(index) {
      current = (index + photos.length) % photos.length;
      const name = photos[current];
      const src = `../../assets/images/panneau-solaire/${name}`;
      photo.src = src;
      photo.alt = `Photo ${current + 1} du projet éclairage solaire autonome`;
      filename.textContent = name;
      counter.textContent = `${current + 1} / ${photos.length}`;
      [...thumbs.children].forEach((button, buttonIndex) => button.setAttribute('aria-current', buttonIndex === current));
    }
    photos.forEach((name, index) => {
      const button = document.createElement('button');
      button.className = 'thumb'; button.type = 'button'; button.setAttribute('aria-label', `Afficher la photo ${index + 1}`);
      const image = document.createElement('img'); image.src = `../../assets/images/panneau-solaire/${name}`; image.alt = '';
      button.append(image); button.addEventListener('click', () => showPhoto(index)); thumbs.append(button);
    });
    document.querySelector('.nav--prev').addEventListener('click', () => showPhoto(current - 1));
    document.querySelector('.nav--next').addEventListener('click', () => showPhoto(current + 1));
    document.addEventListener('keydown', (event) => { if (event.key === 'ArrowLeft') showPhoto(current - 1); if (event.key === 'ArrowRight') showPhoto(current + 1); });
    showPhoto(0);
  </script>
</body>
</html>
